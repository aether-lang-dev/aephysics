---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

# Pin: 0.949.0, the latest release, and aeb v0.347, the one ae3d builds
# beside. 0.949.0 is a tracking bump with one rename: height-field loading read its
# numbers with string.to_double, now string.to_float (0.948.0; the old name stays as
# an alias for now), which parses at 64 bits with strtod, and the golden trace and
# every test pass unchanged (ae-x64, scripts/test.sh). 0.947.0 also checks os.which and
# os.getcwd against the sandbox and makes a wrong-count multi-value return E0200; nothing
# here trips either. Before it, 0.946.0 was a tracking bump, no source change (a selective `import std.math (...)` no longer breaks `math.sqrt` in another module, aether#3877; before it 0.945.0 was a tracking bump too: a macOS cross-build link fix and
# three typechecker fixes, struct literal fields against module variables, glob imports
# binding only exports, and a local named like an imported function now E0301; nothing
# here trips them). 0.944.0 brings std.math's square root inline (aether#3852, an
# out-of-line call before: trees25 3% faster) and a returned view's
# release without a call (#3853); 0.942.0 and 0.943.0 were runtime and
# actor fixes nothing here uses. 0.941.0 was a tracking bump, no source change (actor message
# batching and the account trip under a parent account, #3857 and #3858;
# nothing here sends actor messages or sets a memory account). 0.940.0
# brings lane min/max as minps/maxps (aether#3815) and
# --param relation-block-limit=0 on every GCC compile (aether#3848),
# neither changing a bit of ours. 0.939.0 was a tracking bump, no source
# change (it removes std.http.client's process-wide pool; nothing here
# makes HTTP requests); 0.938.0 was a tracking bump (aether#3821's discarded
# slice-returning calls clean under clang -Wunused-value, #3818's
# correctly rounded float parsing on mingw-w64). 0.937.0 brought returned views tracked by their mark
# (aether#3787) and the GCC inlining budget on optimising builds
# (aether#3779), for which aether.toml dropped its own; every module,
# test, benchmark and example checks clean on it, the golden trace bit
# for bit against 0.936.0 (itself a tracking bump from 0.935.0, 0.933.0,
# 0.931.0 and 0.919.0) with no source change from 0.841.0. 0.840.0 and 0.841.0 added the ownership rules (a borrowed ptr put
# into a list or map is E0902 without @keep) and E0202 / E0305. The two functions that take over a
# struct's buffers declare it `@keep`, which 0.838.0 checks; the
# accessors that hand back a pointer into their argument declare it
# `@into` (aether#2990), which 0.836.0 checks; the lane moves
# (aether#2550), bit casts and reductions (#2603) and
# `@target("avx2") import` (#2607) are 0.835.0's. A reproducible
# bootstrap version: the floor this code needs, verified by every job
# below.
env:
  AE_PIN: 0.949.0
  AEB_REF: v0.347

jobs:
  test:
    name: aephysics tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      - name: Install the released Aether toolchain and aeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/get.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the tests with ae
        run: scripts/test.sh

      # The wide contact solver as one AVX2 register per eight lanes, with
      # FMA on the machine as well: the scenes that cross the lanes keep
      # their checks, and the determinism trace its bits (-ffp-contract=off
      # keeps the compiler from fusing, #125).
      - name: The eight lanes in AVX2 with FMA
        env:
          AETHER_AEPHYSICS_CFLAGS: -mavx2 -mfma
        run: |
          for t in test_determinism test_contact_solver_wide test_soak test_solver; do
            ae build "tests/$t.ae" -o "target/avx2_$t"
            "target/avx2_$t"
          done
          cp target/avx2_test_determinism target/test_determinism
          scripts/golden_trace.sh check

  # arm64, where the compiler fuses multiply-adds unless told not to: the
  # whole suite, the golden trace included (#125).
  macos:
    name: aephysics tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      - name: Install the released Aether toolchain and aeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/get.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the tests with ae
        run: scripts/test.sh

  # Windows, where ae3d and Siltreach run, and -O0, which ae3d builds its
  # suites at. Neither was built here, and two bugs reached ae3d first
  # (#184): four workers parting at -O0, because MinGW's library sqrt
  # rounds twice at the main thread's x87 precision (the engine now takes
  # std.math's), and GCC on Win64 crashing on the AVX2 copies at -O0
  # (aether#3023). This leg cannot see the crash: `ae build` passes
  # -fstack-protector-strong, which keeps GCC clear of it, and a build
  # that calls gcc itself without it (ae3d's) is where it shows.
  windows:
    name: aephysics tests (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      # UCRT64: the release's libaether.a links the Universal CRT, and does
      # not link against an msvcrt gcc. diffutils for the golden trace's
      # diff, which MSYS2's base install lacks.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            diffutils
            unzip
            mingw-w64-ucrt-x86_64-gcc

      # The Windows release is a .zip, and get.sh looks for a .tar.gz (it
      # would build the compiler from source instead), so it is fetched
      # here.
      - name: Install the released Aether toolchain
        run: |
          mkdir -p target
          curl -fsSL -o target/aether.zip \
            "https://github.com/aether-lang-dev/aether/releases/download/v$AE_PIN/aether-$AE_PIN-windows-x86_64.zip"
          mkdir -p "$HOME/aether" && unzip -q target/aether.zip -d "$HOME/aether"
          "$HOME/aether/bin/ae" version

      # PATH is set in each step: setup-msys2's shell does not read what
      # GITHUB_PATH adds.
      - name: Run the tests with ae
        run: |
          export PATH="$HOME/aether/bin:$PATH"
          scripts/test.sh

      # Unoptimized, every maths function is a library call and every
      # function holds its lanes on the stack: the scenes keep their bits
      # over four workers, and the trace matches the golden one.
      - name: The determinism scenes at -O0
        env:
          AETHER_AEPHYSICS_CFLAGS: -O0
        run: |
          export PATH="$HOME/aether/bin:$PATH"
          ae build tests/test_determinism.ae -o target/test_determinism
          target/test_determinism
          scripts/golden_trace.sh check
