---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: aephysics tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      # Tracking pin: 0.778.0, the floor shared by the whole Aether family.
      # The complete suite passed with 0.778.0 on macOS arm64 on 2026-10-05.
      # Linux remains verified by this job, not by that run.
      # This is a reproducible bootstrap version, not a claimed API floor.
      - name: Install the released Aether toolchain and aeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/get.sh \
            | AE_PIN=0.778.0 AEB_REF=v0.325 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the tests with ae
        run: scripts/test.sh

      # The determinism scenes' per-step checksums, for a diff against a
      # run on another platform (issue #27): the log is the record.
      - name: Trace the determinism scenes
        run: |
          AEPHYSICS_TRACE=1 target/test_determinism > target/trace_linux.txt
          wc -l target/trace_linux.txt
          cat target/trace_linux.txt
