---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: aephysics tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      # Pin: 0.797.0, the latest release (f32x8 arrived in 0.788.0, aether#2428,
      # which the wide contact solver is written in). A reproducible bootstrap
      # version: the floor this code needs, verified on Linux by this job.
      - name: Install the released Aether toolchain and aeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/get.sh \
            | AE_PIN=0.797.0 AEB_REF=v0.325 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the tests with ae
        run: scripts/test.sh

      # The wide contact solver as one AVX2 register per eight lanes, with
      # FMA on the machine as well: the scenes that cross the lanes keep
      # their checks, and the determinism trace its bits (-ffp-contract=off
      # keeps the compiler from fusing, #125).
      - name: The eight lanes in AVX2 with FMA
        env:
          AETHER_AEPHYSICS_CFLAGS: -mavx2 -mfma
        run: |
          for t in test_determinism test_contact_solver_wide test_soak test_solver; do
            ae build "tests/$t.ae" -o "target/avx2_$t"
            "target/avx2_$t"
          done
          cp target/avx2_test_determinism target/test_determinism
          scripts/golden_trace.sh check

  # arm64, where the compiler fuses multiply-adds unless told not to: the
  # whole suite, the golden trace included (#125).
  macos:
    name: aephysics tests (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout aephysics
        uses: actions/checkout@v4

      - name: Install the released Aether toolchain and aeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeb/main/get.sh \
            | AE_PIN=0.797.0 AEB_REF=v0.325 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the tests with ae
        run: scripts/test.sh
